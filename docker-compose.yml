services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: boothq
      POSTGRES_PASSWORD: boothq
      POSTGRES_DB: boothq
    ports:
      - "5432:5432"
    volumes:
      - boothq-postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  boothq-postgres-data:
